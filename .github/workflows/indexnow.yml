name: IndexNow submit

on:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "sitemap.xml"
      - "robots.txt"
      - "c6a7f9e14b2d43c58a1e9076d35f24bc.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for GitHub Pages deployment
        run: sleep 90

      - name: Submit priority URLs to IndexNow
        run: |
          curl --fail-with-body --retry 3 --retry-delay 10 \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{
              "host": "cyrilmalglaive.github.io",
              "key": "c6a7f9e14b2d43c58a1e9076d35f24bc",
              "keyLocation": "https://cyrilmalglaive.github.io/c6a7f9e14b2d43c58a1e9076d35f24bc.txt",
              "urlList": [
                "https://cyrilmalglaive.github.io/",
                "https://cyrilmalglaive.github.io/cyril-malglaive/",
                "https://cyrilmalglaive.github.io/recherches/",
                "https://cyrilmalglaive.github.io/recherches/no-exit/",
                "https://cyrilmalglaive.github.io/programmes/child-exit/",
                "https://cyrilmalglaive.github.io/publications/"
              ]
            }' \
            https://api.indexnow.org/indexnow
